name: vault-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp clean verify
      - name: Runtime dependency inventory
        run: mvn -B -ntp dependency:tree -Dscope=runtime
      - name: Build image
        run: docker build -t sky-key-vault:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-key-vault:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke startup
        run: docker run --rm -e SKY_VAULT_MASTER_KEY_B64=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8= sky-key-vault:ci | grep '"status":"ready"'
